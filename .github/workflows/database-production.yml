# Applies migrations to production when they merge to main. This is the only
# way production's schema changes. Never seeds: the real family is added by hand.
name: Production database

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
  workflow_dispatch:

concurrency:
  group: database-production
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx supabase db push --yes
          --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
          --password "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
